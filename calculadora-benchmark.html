<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101114">
    <title>Landres Calculator - Benchmark</title>
    <style>
        :root {
            color-scheme: dark;
            --background: #101114;
            --surface: rgba(31, 33, 38, 0.94);
            --text: #f7f7fa;
            --muted: #9699a2;
            --number: #292b30;
            --utility: #55585f;
            --operator: #26384c;
            --gold: #f2bd63;
            --equals: #f4a340;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-width: 320px;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px 14px;
            overflow-x: hidden;
            background:
                radial-gradient(circle at 15% 15%, rgba(53, 83, 124, 0.22), transparent 31rem),
                radial-gradient(circle at 85% 85%, rgba(177, 108, 37, 0.16), transparent 29rem),
                var(--background);
            color: var(--text);
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .calculator {
            width: min(410px, calc(100vw - 28px));
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 42px;
            background: var(--surface);
            box-shadow: 0 32px 80px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(22px);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding: 0 5px;
        }

        .brand {
            color: var(--gold);
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 0.22em;
            text-transform: uppercase;
        }

        .title {
            margin-top: 3px;
            font-size: 1.12rem;
            font-weight: 560;
        }

        .indicator {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--equals);
            box-shadow: 0 0 16px rgba(244, 163, 64, 0.7);
        }

        .display {
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            margin-bottom: 20px;
            padding: 10px 7px;
            overflow: hidden;
            text-align: right;
        }

        .expression {
            min-height: 1.4em;
            overflow: hidden;
            color: var(--muted);
            font-size: 1rem;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .output {
            display: block;
            width: 100%;
            overflow: hidden;
            font-size: clamp(3.25rem, 15vw, 5.25rem);
            font-weight: 300;
            letter-spacing: -0.055em;
            line-height: 1.08;
            white-space: nowrap;
        }

        .output[data-length="medium"] {
            font-size: clamp(2.85rem, 13vw, 4.55rem);
        }

        .output[data-length="long"] {
            font-size: clamp(2.15rem, 10vw, 3.45rem);
        }

        .output[data-length="extra-long"] {
            font-size: clamp(1.65rem, 8vw, 2.65rem);
        }

        .keys {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: clamp(10px, 3vw, 14px);
        }

        .key {
            aspect-ratio: 1;
            display: grid;
            place-items: center;
            border: 1px solid rgba(255, 255, 255, 0.055);
            border-radius: 50%;
            background: var(--number);
            color: var(--text);
            cursor: pointer;
            font: inherit;
            font-size: clamp(1.25rem, 5vw, 1.65rem);
            font-weight: 520;
            box-shadow: 0 10px 22px rgba(0, 0, 0, 0.22);
            transition: transform 140ms ease, filter 140ms ease, background 140ms ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .key:hover {
            filter: brightness(1.1);
            transform: translateY(-2px);
        }

        .key:active,
        .key.pressed {
            filter: brightness(1.18);
            transform: scale(0.94);
        }

        .key:focus-visible {
            outline: 3px solid rgba(244, 163, 64, 0.5);
            outline-offset: 3px;
        }

        .utility {
            background: var(--utility);
            font-size: clamp(1.05rem, 4.3vw, 1.35rem);
        }

        .operator {
            border-color: rgba(242, 189, 99, 0.18);
            background: var(--operator);
            color: var(--gold);
            font-size: clamp(1.55rem, 6vw, 1.95rem);
        }

        .equals {
            border-color: rgba(255, 255, 255, 0.16);
            background: linear-gradient(145deg, #ffb454, var(--equals));
            color: #211508;
            font-size: clamp(1.65rem, 6.5vw, 2.1rem);
            box-shadow: 0 12px 28px rgba(244, 163, 64, 0.27);
        }

        .wide {
            grid-column: span 2;
            aspect-ratio: auto;
            justify-items: start;
            padding-left: 28%;
            border-radius: 999px;
        }

        .hint {
            position: absolute;
            bottom: 18px;
            width: min(410px, calc(100vw - 28px));
            color: #747780;
            font-size: 0.78rem;
            line-height: 1.5;
            text-align: center;
        }

        kbd {
            padding: 2px 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.055);
            font: inherit;
            font-size: 0.72rem;
        }

        @media (max-width: 480px) {
            body {
                padding: 14px 10px 76px;
            }

            .calculator {
                padding: 20px 16px;
                border-radius: 32px;
            }

            .display {
                min-height: 128px;
                margin-bottom: 15px;
            }

            .keys {
                gap: 10px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <main class="calculator" aria-label="Calculadora Lumen">
        <header class="header">
            <div>
                <p class="brand">Landres</p>
                <h1 class="title">Calculator</h1>
            </div>
            <span class="indicator" aria-hidden="true"></span>
        </header>

        <section class="display" aria-label="Pantalla">
            <p class="expression" id="expression" aria-live="polite"></p>
            <output class="output" id="output" aria-live="polite">0</output>
        </section>

        <section class="keys" aria-label="Controles">
            <button class="key utility" data-action="clear" data-keys="Escape|Delete">
                <span id="clear-label">AC</span>
            </button>
            <button class="key utility" data-action="toggle-sign" data-keys="n|N">+/&minus;</button>
            <button class="key utility" data-action="percent" data-keys="%">%</button>
            <button class="key operator" data-operator="/" data-keys="/">&divide;</button>

            <button class="key" data-digit="7" data-keys="7">7</button>
            <button class="key" data-digit="8" data-keys="8">8</button>
            <button class="key" data-digit="9" data-keys="9">9</button>
            <button class="key operator" data-operator="*" data-keys="*|x|X">&times;</button>

            <button class="key" data-digit="4" data-keys="4">4</button>
            <button class="key" data-digit="5" data-keys="5">5</button>
            <button class="key" data-digit="6" data-keys="6">6</button>
            <button class="key operator" data-operator="-" data-keys="-">&minus;</button>

            <button class="key" data-digit="1" data-keys="1">1</button>
            <button class="key" data-digit="2" data-keys="2">2</button>
            <button class="key" data-digit="3" data-keys="3">3</button>
            <button class="key operator" data-operator="+" data-keys="+">+</button>

            <button class="key wide" data-digit="0" data-keys="0">0</button>
            <button class="key" data-action="decimal" data-keys=".|,">.</button>
            <button class="key equals" data-action="equals" data-keys="=|Enter">=</button>
        </section>
    </main>

    <p class="hint">
        Teclado compatible: n&uacute;meros, operadores, <kbd>Enter</kbd>,
        <kbd>.</kbd> y <kbd>Esc</kbd>.
    </p>

    <script>
        'use strict';

        /* Constantes para limitar la entrada y reducir residuos decimales. */
        const MAX_DIGITS = 16;
        const DECIMAL_PRECISION = 12;

        /* La clase concentra estado, calculos, teclado y representacion. */
        class Calculator {
            constructor() {
                this.output = document.querySelector('#output');
                this.expression = document.querySelector('#expression');
                this.clearLabel = document.querySelector('#clear-label');
                this.buttons = [...document.querySelectorAll('.key')];
                this.state = this.initialState();
                this.bindEvents();
                this.render();
            }

            initialState() {
                return {
                    input: '0', previous: null, operator: null,
                    lastOperator: null, lastOperand: null, waiting: false,
                    entered: false, calculated: false, error: false,
                    expression: ''
                };
            }

            /* El DOM y el teclado reutilizan exactamente las mismas acciones. */
            bindEvents() {
                this.buttons.forEach((button) => {
                    button.addEventListener('click', () => this.activate(button));
                });

                document.addEventListener('keydown', (event) => {
                    if (event.ctrlKey || event.metaKey || event.altKey) return;
                    const button = this.buttons.find((item) =>
                        (item.dataset.keys || '').split('|').includes(event.key)
                    );
                    if (!button) return;
                    event.preventDefault();
                    button.classList.add('pressed');
                    window.setTimeout(() => button.classList.remove('pressed'), 120);
                    button.click();
                });
            }

            activate(button) {
                if (button.dataset.digit !== undefined) {
                    this.addDigit(button.dataset.digit);
                } else if (button.dataset.operator !== undefined) {
                    this.setOperator(button.dataset.operator);
                } else {
                    const actions = {
                        clear: () => this.clear(),
                        decimal: () => this.addDecimal(),
                        equals: () => this.equals(),
                        percent: () => this.percent(),
                        'toggle-sign': () => this.changeSign()
                    };
                    actions[button.dataset.action]?.();
                }
            }

            addDigit(digit) {
                if (this.state.error) this.reset();
                if (this.state.calculated) this.newCalculation();

                if (this.state.waiting) {
                    this.state.input = digit;
                    this.state.waiting = false;
                } else if (this.state.input === '0') {
                    this.state.input = digit;
                } else if (this.digits(this.state.input) < MAX_DIGITS) {
                    this.state.input += digit;
                }

                this.state.entered = true;
                this.render();
            }

            addDecimal() {
                if (this.state.error) this.reset();
                if (this.state.calculated) this.newCalculation();

                if (this.state.waiting) {
                    this.state.input = '0.';
                    this.state.waiting = false;
                } else if (!this.state.input.includes('.')) {
                    this.state.input += '.';
                }

                this.state.entered = true;
                this.render();
            }

            /* Los operadores encadenados resuelven primero la operacion anterior. */
            setOperator(nextOperator) {
                if (this.state.error) return;
                const value = this.number(this.state.input);

                if (this.state.operator && !this.state.waiting) {
                    const result = this.compute(
                        this.state.previous,
                        value,
                        this.state.operator
                    );
                    if (!this.applyResult(result)) return;
                } else if (this.state.previous === null || this.state.calculated) {
                    this.state.previous = value;
                }

                this.state.operator = nextOperator;
                this.state.waiting = true;
                this.state.calculated = false;
                this.state.entered = false;
                this.state.expression =
                    `${this.format(this.state.previous)} ${this.symbol(nextOperator)}`;
                this.render();
            }

            equals() {
                if (this.state.error) return;
                let left;
                let right;
                let operator;

                if (this.state.operator) {
                    left = this.state.previous;
                    right = this.state.waiting
                        ? this.state.previous
                        : this.number(this.state.input);
                    operator = this.state.operator;
                } else if (this.state.lastOperator && this.state.lastOperand !== null) {
                    left = this.number(this.state.input);
                    right = this.state.lastOperand;
                    operator = this.state.lastOperator;
                } else {
                    return;
                }

                const result = this.compute(left, right, operator);
                if (!this.applyResult(result)) return;

                this.state.lastOperator = operator;
                this.state.lastOperand = right;
                this.state.operator = null;
                this.state.waiting = true;
                this.state.entered = false;
                this.state.calculated = true;
                this.state.expression =
                    `${this.format(left)} ${this.symbol(operator)} ${this.format(right)} =`;
                this.render();
            }

            compute(left, right, operator) {
                let result;
                switch (operator) {
                    case '+': result = left + right; break;
                    case '-': result = left - right; break;
                    case '*': result = left * right; break;
                    case '/':
                        if (right === 0) return { error: true };
                        result = left / right;
                        break;
                    default: return { error: true };
                }
                return { value: this.normalize(result) };
            }

            applyResult(result) {
                if (result.error) {
                    this.showError();
                    return false;
                }
                this.state.input = this.format(result.value);
                this.state.previous = result.value;
                return true;
            }

            /* En sumas y restas el porcentaje se calcula sobre el primer valor. */
            percent() {
                if (this.state.error) return;
                const value = this.number(this.state.input);
                const contextual = this.state.operator === '+' || this.state.operator === '-';
                const result = contextual
                    ? this.normalize(this.state.previous * value / 100)
                    : this.normalize(value / 100);

                this.state.input = this.format(result);
                this.state.waiting = false;
                this.state.calculated = false;
                this.state.entered = true;
                this.state.expression = `${this.format(value)}%`;
                this.render();
            }

            changeSign() {
                if (this.state.error || this.state.input === '0') return;
                this.state.input = this.state.input.startsWith('-')
                    ? this.state.input.slice(1)
                    : `-${this.state.input}`;
                this.state.entered = true;
                this.render();
            }

            /* C limpia el valor actual y AC reinicia toda la operacion. */
            clear() {
                if (this.state.error || this.state.calculated || !this.state.entered) {
                    this.reset();
                    return;
                }
                this.state.input = '0';
                this.state.waiting = Boolean(this.state.operator);
                this.state.entered = false;
                this.state.lastOperator = null;
                this.state.lastOperand = null;
                this.render();
            }

            reset() {
                this.state = this.initialState();
                this.render();
            }

            newCalculation() {
                this.state.previous = null;
                this.state.operator = null;
                this.state.lastOperator = null;
                this.state.lastOperand = null;
                this.state.waiting = false;
                this.state.calculated = false;
                this.state.expression = '';
            }

            showError() {
                this.state.error = true;
                this.state.input = '0';
                this.state.previous = null;
                this.state.operator = null;
                this.state.waiting = true;
                this.state.entered = false;
                this.state.calculated = false;
                this.state.expression = 'No se puede dividir entre cero';
                this.render();
            }

            number(value) {
                return Number.parseFloat(value.replace(',', '.')) || 0;
            }

            normalize(value) {
                return Number.isFinite(value)
                    ? Number.parseFloat(value.toFixed(DECIMAL_PRECISION))
                    : value;
            }

            format(value) {
                return Number.isFinite(value) ? String(this.normalize(value)) : 'Error';
            }

            digits(value) {
                return value.replace('-', '').replace('.', '').length;
            }

            symbol(operator) {
                return { '+': '+', '-': '-', '*': '*', '/': '/' }[operator];
            }

            render() {
                const visible = this.state.error ? 'Error' : this.state.input;
                const count = visible.replace(/\D/g, '').length;
                this.output.textContent = visible;
                this.output.dataset.length =
                    count > 14 ? 'extra-long'
                    : count > 11 ? 'long'
                    : count > 8 ? 'medium'
                    : 'short';
                this.expression.textContent = this.state.expression;
                this.clearLabel.textContent =
                    this.state.entered || this.state.calculated || this.state.error
                        ? 'C' : 'AC';
            }
        }

        document.addEventListener('DOMContentLoaded', () => new Calculator());
    </script>
</body>
</html>
</html>
